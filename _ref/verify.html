<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YBA — page verification</title>
<style>
 body{font:13px/1.5 ui-monospace,monospace;padding:16px;margin:0}
 table{border-collapse:collapse}
 td,th{padding:3px 10px;border-bottom:1px solid #eee;text-align:right}
 td:first-child,th:first-child{text-align:left}
 .ok{color:#0a7a2f}.warn{color:#b06d00}.bad{color:#c00;font-weight:700}
 iframe{width:1440px;height:400px;border:0;position:absolute;left:-4000px}
</style>
</head>
<body>
<h1 style="font:600 16px system-ui">Rendered height vs YBA-2 design (1440px wide)</h1>
<table id="t"><thead><tr><th>page</th><th>rendered</th><th>Figma</th><th>diff</th><th>%</th></tr></thead><tbody></tbody></table>
<div id="frames"></div>
<script>
// Each Figma frame's exported pixel height at 1440px wide.
const PAGES = [
  ["index.html", 2508],
  ["about.html", 2877],
  ["volunteer.html", 2672],
  ["partnerships.html", 2620],
  ["join.html", 1558],
  ["resources.html", 1862],
  ["resources-certifications.html", 1402],
  ["resources-publications.html", 1114],
  ["resources-awards.html", 1224],
  ["resources-podcasts.html", 1772],
  ["resources-events.html", 1514],
  ["blog.html", 1510],
  ["blog-post.html", 2577],
  ["privacy.html", 3846]
];

const tbody = document.querySelector("#t tbody");
const frames = document.getElementById("frames");

function measure([page, want]) {
  return new Promise(res => {
    const f = document.createElement("iframe");
    f.src = "/" + page;
    f.onload = () => {
      // Fonts must be ready or heights are measured against the fallback.
      f.contentWindow.document.fonts.ready.then(() => setTimeout(() => {
        const got = f.contentDocument.documentElement.scrollHeight;
        const overflow = f.contentDocument.documentElement.scrollWidth > 1440;
        res({ page, want, got, overflow });
        f.remove();
      }, 120));
    };
    frames.appendChild(f);
  });
}

(async () => {
  for (const p of PAGES) {
    const r = await measure(p);
    const d = r.got - r.want;
    const pct = (d / r.want) * 100;
    const cls = Math.abs(pct) < 1 ? "ok" : Math.abs(pct) < 3 ? "warn" : "bad";
    tbody.insertAdjacentHTML("beforeend",
      `<tr><td>${r.page}${r.overflow ? ' <span class="bad">H-OVERFLOW</span>' : ''}</td>` +
      `<td>${r.got}</td><td>${r.want}</td>` +
      `<td class="${cls}">${d > 0 ? "+" : ""}${d}</td>` +
      `<td class="${cls}">${pct > 0 ? "+" : ""}${pct.toFixed(1)}%</td></tr>`);
  }
  document.title = "done";
})();
</script>
</body>
</html>
